<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderation - CivMC Shops</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body class="mod-page">
<nav id="nav"></nav>
<main>
  <header class="mod-hero">
    <div class="mod-hero-copy">
      <span class="mod-eyebrow">Staff console</span>
      <h1>Moderation</h1>
      <p class="sub">Timeouts hide shops, listings, and comments from the public. Timed-out accounts can't log in. Nothing is deleted.</p>
    </div>
  </header>

  <div class="msg" id="msg"></div>

  <section class="mod-section mod-section--reports collapse-section" data-collapse="reports" aria-labelledby="mod-reports-h">
    <div class="mod-section-head">
      <h2 id="mod-reports-h">
        <button type="button" class="collapse-toggle" aria-expanded="true" aria-controls="collapse-reports">
          <span class="collapse-chevron" aria-hidden="true"></span>
          <span class="mod-section-head-text">
            <span class="mod-section-title">Open reports</span>
            <span class="meta">Review, timeout the target, or dismiss.</span>
          </span>
        </button>
      </h2>
    </div>
    <div class="collapse-body" id="collapse-reports">
      <div class="mod-stack" id="reports"></div>
    </div>
  </section>

  <section class="mod-section mod-section--tips collapse-section" data-collapse="tips" aria-labelledby="mod-tips-h">
    <div class="mod-section-head">
      <h2 id="mod-tips-h">
        <button type="button" class="collapse-toggle" aria-expanded="true" aria-controls="collapse-tips">
          <span class="collapse-chevron" aria-hidden="true"></span>
          <span class="mod-section-head-text">
            <span class="mod-section-title">Tip-jar brigading</span>
            <span class="meta">Suspicious Fair/High/Low vote bursts. Timeout the account or clear votes - shops stay intact.</span>
          </span>
        </button>
      </h2>
    </div>
    <div class="collapse-body" id="collapse-tips">
      <div class="mod-stack" id="tipflags"></div>
    </div>
  </section>

  <div class="mod-tools">
    <div class="stickybar mod-filterbar">
      <label class="mod-filter-label" for="filter">Filter tools</label>
      <input type="search" id="filter" placeholder="Filter accounts, shops, listings by name or item">
    </div>

    <section class="mod-section mod-section--list collapse-section" data-collapse="accounts" aria-labelledby="mod-users-h">
      <div class="mod-section-head">
        <h2 id="mod-users-h">
          <button type="button" class="collapse-toggle" aria-expanded="true" aria-controls="collapse-users">
            <span class="collapse-chevron" aria-hidden="true"></span>
            <span class="mod-section-title">Accounts</span>
          </button>
        </h2>
      </div>
      <div class="collapse-body" id="collapse-users">
        <div class="mod-list" id="users"></div>
      </div>
    </section>

    <section class="mod-section mod-section--list collapse-section" data-collapse="shops" aria-labelledby="mod-shops-h">
      <div class="mod-section-head">
        <h2 id="mod-shops-h">
          <button type="button" class="collapse-toggle" aria-expanded="true" aria-controls="collapse-mod-shops">
            <span class="collapse-chevron" aria-hidden="true"></span>
            <span class="mod-section-title">Shops</span>
          </button>
        </h2>
      </div>
      <div class="collapse-body" id="collapse-mod-shops">
        <div class="mod-list" id="shops"></div>
      </div>
    </section>

    <section class="mod-section mod-section--list collapse-section" data-collapse="listings" aria-labelledby="mod-listings-h">
      <div class="mod-section-head">
        <h2 id="mod-listings-h">
          <button type="button" class="collapse-toggle" aria-expanded="true" aria-controls="collapse-listings">
            <span class="collapse-chevron" aria-hidden="true"></span>
            <span class="mod-section-title">Listings</span>
          </button>
        </h2>
      </div>
      <div class="collapse-body" id="collapse-listings">
        <div class="mod-list" id="listings"></div>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="app.js?v=7"></script>
<script>
const msg = document.getElementById("msg");
const filter = document.getElementById("filter");
const same = (a, b) => String(a) === String(b);
let me = null;
let data = { users: [], shops: [], listings: [], comments: [], reviews: [], reports: [], tipVotes: [] };

async function load() {
  const ctx = await requireLogin("staff");
  if (!ctx) return;
  me = ctx.profile;
  const [u, s, l, c, r, rv, tv] = await Promise.all([
    sb.from("profiles").select("*").order("username"),
    sb.from("shops").select("id, name, city, nation, timed_out, owner_id, profiles(username, mc_username)").order("name"),
    sb.from("listings").select("*, shops(name)").order("id"),
    sb.from("comments").select("id, shop_id, author_id, body, timed_out, profiles(username, mc_username)").order("id"),
    sb.from("reports").select("*").order("id", { ascending: false }),
    sb.from("reviews").select("id, shop_id, author_id, rating, body, timed_out, profiles(username, mc_username)").order("id"),
    sb.from("tip_votes").select("id, user_id, listing_id, vote, created_at").order("created_at", { ascending: false })
  ]);
  data = { users: u.data || [], shops: s.data || [], listings: l.data || [], comments: c.data || [], reviews: rv.data || [], reports: r.data || [], tipVotes: tv.data || [] };
  render();
}

const canTimeoutUser = u => !u.is_head && (!u.is_admin || me.is_head) && (!u.is_mod || me.is_admin);
const tbtn = (kind, id, on) =>
  `<button class="small ico-label btn-timeout" data-kind="${kind}" data-id="${id}" data-to="${on ? 1 : 0}">${uiIcon("clock")} ${on ? "Timeout" : "Remove timeout"}</button>`;
const listingText = l => `${l.want_amount}${l.want_unit ? " " + l.want_unit.toUpperCase() : ""} ${l.want_item} \u2192 ${l.sell_amount}${l.sell_unit ? " " + l.sell_unit.toUpperCase() : ""} ${l.sell_item}`;

function targetInfo(r) {
  if (r.target_type === "shop") {
    const s = data.shops.find(x => same(x.id, r.target_id));
    return s && { label: "Shop: " + s.name, href: "shop.html?id=" + s.id, out: stillTimedOut(s), table: "shops" };
  }
  if (r.target_type === "listing") {
    const l = data.listings.find(x => same(x.id, r.target_id));
    return l && { label: "Listing: " + listingText(l), href: "shop.html?id=" + l.shop_id + "&listing=" + l.id, out: stillTimedOut(l), table: "listings" };
  }
  if (r.target_type === "comment") {
    const c = data.comments.find(x => same(x.id, r.target_id));
    return c && { label: `Comment by ${c.profiles ? userName(c.profiles) : "?"}: "${c.body.slice(0, 80)}"`, href: "shop.html?id=" + c.shop_id + "#comment-" + c.id, out: stillTimedOut(c), table: "comments" };
  }
  if (r.target_type === "review") {
    const v = data.reviews.find(x => same(x.id, r.target_id));
    return v && { label: `Review by ${v.profiles ? userName(v.profiles) : "?"} (${v.rating}/5)${v.body ? ": \"" + v.body.slice(0, 80) + "\"" : ""}`, href: "shop.html?id=" + v.shop_id + "#review-" + v.id, out: stillTimedOut(v), table: "reviews" };
  }
  const u = data.users.find(x => same(x.id, r.target_id));
  return u && { label: "User: " + userName(u), href: "profile.html?id=" + u.id, out: stillTimedOut(u), user: u, canTimeout: canTimeoutUser(u) };
}

function render() {
  const f = norm(filter.value);
  const hit = (...parts) => !f || parts.some(p => String(p ?? "").toLowerCase().includes(f));

  const open = data.reports.filter(r => r.status === "open");
  document.getElementById("reports").innerHTML = open.map(r => {
    const t = targetInfo(r);
    const who = data.users.find(u => u.id === r.reporter_id);
    const canT = t && !t.out && (t.user ? t.canTimeout : true);
    const href = t ? `href="${esc(t.href)}"` : "";
    const parsed = parseReportReason(r);
    return `<div class="card mod-report-card">
      <div class="top">
        <div>${t ? `<a ${href} style="color:var(--accent)">${esc(t.label)}</a>` : '<span class="meta">(already deleted)</span>'}
          ${t && t.out ? '<span class="tag bad">timed out</span>' : ""}
          <span class="tag bad">${esc(r.target_type)}</span></div>
        <span class="meta">by ${esc(who ? userName(who) : "?")} \u00b7 ${agoText(r.created_at)}</span>
      </div>
      <div class="mod-report-reason">
        <span class="tag warn">${esc(parsed.label)}</span>
        ${parsed.details ? `<span>${esc(parsed.details)}</span>` : '<span class="meta">No extra details</span>'}
      </div>
      <div class="inline-actions">
        ${canT ? `<button class="small ico-label btn-timeout" data-rep="timeout" data-id="${r.id}">${uiIcon("clock")} Timeout it</button>` : ""}
        ${iconBtn("x", { title: "Dismiss report", attrs: `data-rep="dismiss" data-id="${r.id}"` })}
      </div>
    </div>`;
  }).join("") || '<p class="meta">No open reports.</p>';

  const flags = tipBrigadeFlags(data.tipVotes, data.listings);
  document.getElementById("tipflags").innerHTML = flags.length ? flags.map(f => {
    const u = f.user_id ? data.users.find(x => same(x.id, f.user_id)) : null;
    const l = f.listing_id != null ? data.listings.find(x => same(x.id, f.listing_id)) : null;
    const shop = f.shop_id != null ? data.shops.find(x => same(x.id, f.shop_id)) : (l ? data.shops.find(x => same(x.id, l.shop_id)) : null);
    const who = u ? `<a href="profile.html?id=${u.id}" style="color:var(--accent)">${esc(userName(u))}</a>` : '<span class="meta">-</span>';
    const where = l
      ? `<a href="shop.html?id=${l.shop_id}&listing=${l.id}" style="color:var(--accent)">${esc(listingText(l))}</a>`
      : shop ? `<a href="shop.html?id=${shop.id}" style="color:var(--accent)">${esc(shop.name)}</a>` : "";
    let acts = "";
    if (u && canTimeoutUser(u) && !stillTimedOut(u)) acts += `<button class="small ico-label btn-timeout" data-kind="user" data-id="${u.id}" data-to="1">${uiIcon("clock")} Timeout account</button>`;
    if (l && !stillTimedOut(l)) acts += tbtn("listing", l.id, true);
    if (l) acts += `<button class="small btn-report" data-tipclear="${l.id}">Clear tip votes</button>`;
    if (u) acts += `<button class="small btn-report" data-tipclear-user="${u.id}">Clear their tip votes</button>`;
    return `<div class="card">
      <div class="top">
        <div><span class="tag ${f.severity === "bad" ? "bad" : "warn"}">${esc(f.kind.replace(/_/g, " "))}</span> ${who}
          ${where ? '<span class="meta"> \u00b7 </span>' + where : ""}</div>
        <span class="meta">${esc(f.tip)}</span>
      </div>
      <div class="inline-actions" style="margin-top:8px">${acts}</div>
    </div>`;
  }).join("") : '<p class="meta">No tip-jar brigading patterns right now.</p>';

  document.getElementById("users").innerHTML = data.users
    .filter(u => !u.is_head && (!u.is_admin || me.is_head) && hit(userName(u), u.mc_username))
    .map(u => `<div class="listing">
      <div>${esc(userName(u))} ${u.is_admin ? '<span class="tag">admin</span>' : ""} ${u.is_mod ? '<span class="tag">mod</span>' : ""}
        ${!u.verified_at ? '<span class="tag warn">unverified</span>' : ""} ${stillTimedOut(u) ? `<span class="tag bad">timed out</span> <span class="meta">${esc(timeoutUntilLabel(u))}</span>` : ""}</div>
      ${canTimeoutUser(u) ? tbtn("user", u.id, !stillTimedOut(u)) : ""}
    </div>`).join("") || '<p class="meta">None.</p>';

  document.getElementById("shops").innerHTML = data.shops
    .filter(s => hit(s.name, s.city, s.nation, s.profiles && userName(s.profiles), s.profiles && s.profiles.mc_username))
    .map(s => `<div class="listing">
      <div><a href="shop.html?id=${s.id}" style="color:inherit">${esc(s.name)}</a>
        <span class="meta">\u00b7 ${esc(s.profiles ? userName(s.profiles) : "?")}${placeHtml(s) ? " \u00b7 " + placeHtml(s) : ""}</span> ${stillTimedOut(s) ? `<span class="tag bad">timed out</span> <span class="meta">${esc(timeoutUntilLabel(s))}</span>` : ""}</div>
      ${tbtn("shop", s.id, !stillTimedOut(s))}
    </div>`).join("") || '<p class="meta">None.</p>';

  document.getElementById("listings").innerHTML = data.listings
    .filter(l => hit(l.sell_item, l.want_item, l.shops && l.shops.name))
    .map(l => `<div class="listing">
      <div>${itemText(l.want_amount, l.want_item, l.want_unit)} <span class="arrow">&rarr;</span> ${itemText(l.sell_amount, l.sell_item, l.sell_unit)}
        <span class="meta">\u00b7 <a href="shop.html?id=${l.shop_id}&listing=${l.id}">${esc(l.shops ? l.shops.name : "?")}</a></span>
        ${stillTimedOut(l) ? `<span class="tag bad">timed out</span> <span class="meta">${esc(timeoutUntilLabel(l))}</span>` : ""}</div>
      ${tbtn("listing", l.id, !stillTimedOut(l))}
    </div>`).join("") || '<p class="meta">None.</p>';
}

filter.addEventListener("input", render);

async function resolveReport(id) {
  await sb.from("reports").update({ status: "resolved" }).eq("id", id);
}

document.querySelector("main").addEventListener("click", async e => {
  const clearL = e.target.closest("button[data-tipclear]");
  if (clearL) {
    if (!await confirmModal({ title: "Clear tip votes", body: "Clear all tip-jar votes on this listing?", confirmLabel: "Clear votes", danger: true })) return;
    const { error } = await sb.from("tip_votes").delete().eq("listing_id", clearL.dataset.tipclear);
    if (error) { setMsg(msg, error.message, "err"); return; }
    setMsg(msg, "Cleared tip votes on that listing.", "ok");
    load();
    return;
  }
  const clearU = e.target.closest("button[data-tipclear-user]");
  if (clearU) {
    if (!await confirmModal({ title: "Clear tip votes", body: "Clear all tip-jar votes from this account?", confirmLabel: "Clear votes", danger: true })) return;
    const { error } = await sb.from("tip_votes").delete().eq("user_id", clearU.dataset.tipclearUser);
    if (error) { setMsg(msg, error.message, "err"); return; }
    setMsg(msg, "Cleared that user's tip votes.", "ok");
    load();
    return;
  }

  const rb = e.target.closest("button[data-rep]");
  if (rb) {
    const r = data.reports.find(x => same(x.id, rb.dataset.id));
    if (rb.dataset.rep === "timeout") {
      const t = targetInfo(r);
      let err = null;
      if (t && t.user) {
        const res = await applyUserTimeout(t.user.id, true);
        if (res.cancelled) return;
        if (!res.ok) err = res.message;
      } else if (t) {
        err = await applyContentTimeout(t.table, r.target_id, true);
        if (err === "") return;
      }
      if (err) { setMsg(msg, err, "err"); return; }
    }
    await resolveReport(r.id);
    setMsg(msg, "");
    load();
    return;
  }

  const b = e.target.closest("button[data-kind]");
  if (!b) return;
  const on = b.dataset.to === "1";
  const id = b.dataset.id;
  let err = null;
  if (b.dataset.kind === "user") {
    const r = await applyUserTimeout(id, on);
    if (r.cancelled) return;
    if (!r.ok) err = r.message;
  } else {
    const table = b.dataset.kind === "shop" ? "shops" : "listings";
    err = await applyContentTimeout(table, id, on);
    if (err === "") return;
  }
  if (err) { setMsg(msg, err, "err"); return; }
  setMsg(msg, "");
  load();
});

load();
</script>
</body>
</html>
