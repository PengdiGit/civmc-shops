# Optional alternative to Cloudflare Worker: terminate civshops.pengworld.net on the
# pengworld.net VPS (nginx) and proxy crawlers to the Supabase embed function.
#
# DNS: change civshops from CNAME→github.io to A→ this VPS (185.206.150.202).
# Then humans are proxied to GitHub Pages; Discordbot gets per-shop OG HTML.

map $http_user_agent $civshops_is_bot {
    default                                         0;
    ~*(Discordbot|Slackbot|Twitterbot|facebookexternalhit|Facebot|LinkedInBot|TelegramBot|WhatsApp|Embedly|Pinterest|Iframely|redditbot|Applebot|SkypeUriPreview) 1;
}

upstream civshops_pages {
    server pengdigit.github.io:443;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name civshops.pengworld.net;

    # --- crawlers: per-shop / per-profile Open Graph ---
    location = /shops/ {
        if ($civshops_is_bot = 0) { rewrite ^ /__pages$request_uri last; }
        proxy_ssl_server_name on;
        proxy_pass https://isxjyehkrpyyupltbbna.supabase.co/functions/v1/embed?shop=$arg_id&listing=$arg_listing;
        proxy_set_header Host isxjyehkrpyyupltbbna.supabase.co;
    }

    location = /profile/ {
        if ($civshops_is_bot = 0) { rewrite ^ /__pages$request_uri last; }
        proxy_ssl_server_name on;
        set $emb https://isxjyehkrpyyupltbbna.supabase.co/functions/v1/embed;
        if ($arg_id)   { set $emb $emb?profile=$arg_id; }
        if ($arg_name) { set $emb $emb?name=$arg_name; }
        proxy_pass $emb;
        proxy_set_header Host isxjyehkrpyyupltbbna.supabase.co;
    }

    location = /market/ {
        if ($civshops_is_bot = 0) { rewrite ^ /__pages$request_uri last; }
        proxy_ssl_server_name on;
        proxy_pass https://isxjyehkrpyyupltbbna.supabase.co/functions/v1/embed?item=$arg_item&enchant=$arg_enchant;
        proxy_set_header Host isxjyehkrpyyupltbbna.supabase.co;
    }

    # --- everyone else / humans: GitHub Pages ---
    location /__pages/ {
        internal;
        proxy_ssl_server_name on;
        proxy_set_header Host pengdigit.github.io;
        proxy_pass https://civshops_pages/civmc-shops/;
    }

    location / {
        if ($civshops_is_bot = 1) {
            # Generic site card for other bot hits
            proxy_ssl_server_name on;
            proxy_pass https://isxjyehkrpyyupltbbna.supabase.co/functions/v1/embed;
            proxy_set_header Host isxjyehkrpyyupltbbna.supabase.co;
            break;
        }
        proxy_ssl_server_name on;
        proxy_set_header Host pengdigit.github.io;
        proxy_pass https://civshops_pages/civmc-shops$request_uri;
    }
}
