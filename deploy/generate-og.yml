name: Generate Open Graph landers

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-og-pages.mjs"
      - "config.js"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate shop/profile OG pages
        run: node scripts/generate-og-pages.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shops profile/ || true
          # Keep SPA entrypoints; only landers + nested folders are expected to change
          if git diff --staged --quiet; then
            echo "No OG lander changes"
          else
            git commit -m "Refresh Open Graph landers for shops and profiles."
            git push
          fi
