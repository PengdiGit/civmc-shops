<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up - CivMC Shops</title>
<link rel="stylesheet" href="../style.css?v=37">
</head>
<body class="auth-page">
<nav id="nav"></nav>
<main>
  <div class="auth-wrap" id="signup-wrap">
    <span class="page-eyebrow">Account</span>
    <h1>Sign up</h1>
    <p class="sub">Already have an account? <a id="login-link" href="../login/">Log in</a>.</p>
    <p class="meta" style="margin:0 0 14px">Pick a login and password. Then connect Discord and Minecraft to unlock shops, comments, and reviews. Until then you can browse, favourite, and report.</p>

    <form class="stack" id="form">
      <label for="u">Login username</label>
      <input id="u" type="text" autocomplete="username" required placeholder="3-20 letters, numbers or _">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="new-password" required minlength="8" placeholder="8+ characters">
      <div class="msg" id="msg"></div>
      <button class="primary" type="submit">Create account</button>
    </form>
    <p class="meta" style="margin-top:14px">Next: <a href="../verify/">connect Discord + Minecraft</a>.</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../app.js?v=39"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const safe = safeAuthReturn(q.get("next") || q.get("return") || q.get("redirect"));
  if (safe) {
    const a = document.getElementById("login-link");
    if (a) a.href = "../login/?next=" + encodeURIComponent(safe);
  }
})();
getSession().then(s => { if (s) goPostAuth(); });

async function showSignupSuccess() {
  const wrap = document.getElementById("signup-wrap");
  wrap.innerHTML = `
    <span class="page-eyebrow">Almost there</span>
    <h1>Account created</h1>
    <p class="sub msg ok" style="margin-bottom:14px">Signed in. Connect Discord and Minecraft to unlock shops, comments, and reviews.</p>
    <div class="row" style="flex-wrap:wrap;gap:10px;margin-bottom:12px">
      <a class="primary" href="../verify/">Connect accounts</a>
      <a class="small" href="../home/">Browse shops</a>
    </div>
    <p class="meta">Until then you can browse, favourite, and report like a guest.</p>`;
  renderNav().catch(() => {});
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  setMsg(msg, "Creating your account...");
  const username = document.getElementById("u").value.trim().toLowerCase();
  const password = document.getElementById("p").value;
  const r = await callFn("signup", { username, password });
  if (!r.ok) { setMsg(msg, r.message, "err"); return; }
  const { error } = await sb.auth.signInWithPassword({ email: username + FAKE_DOMAIN, password });
  if (error) { setMsg(msg, "Account made, but login failed. Try logging in.", "err"); return; }
  await showSignupSuccess();
});
</script>
</body>
</html>
