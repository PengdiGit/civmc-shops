<html lang="en">

<body class="dash-page">
<nav id="nav"></nav>
<main>
  <header class="page-hero">
    <span class="page-eyebrow">Workshop</span>
    <h1>My shops <span class="owner-alert-badge" id="alert-badge" hidden></span></h1>
    <p class="sub" id="who"></p>
  </header>
  <div id="verify"></div>
  <div id="owner-alerts" class="owner-alerts" hidden></div>
  <div id="notifications" class="owner-alerts dash-notifications" hidden></div>

  <div class="dash-new-shop-bar">
    <button type="button" class="dash-new-shop-toggle" id="toggle-new-shop" data-ico="plus">New shop</button>
  </div>
  <div class="dash-new-shop-wrap" id="newshop-wrap" hidden>
  <h2>New shop</h2>
  <div class="panel" id="newshop" data-icon-item="">
    <div class="row">
      <div style="flex:2;min-width:180px"><label for="s-name">Shop name (what people search)</label><input type="text" id="s-name" maxlength="60" style="width:100%"></div>
      <div style="flex:1;min-width:120px"><label for="s-city">City</label><input type="text" id="s-city" class="place-city" maxlength="60" placeholder="Search citiesΓÇª" style="width:100%"></div>
      <div style="flex:1;min-width:120px"><label for="s-nation">Nation</label><input type="text" id="s-nation" class="place-nation" maxlength="60" placeholder="Search nationsΓÇª" style="width:100%"></div>
      <div><label for="s-x">X</label><input type="number" id="s-x" style="width:90px"></div>
      <div><label for="s-z">Z</label><input type="number" id="s-z" style="width:90px"></div>
    </div>

    <label for="s-styled">Fancy name (optional). Minecraft colour codes: <b>&amp;6</b> gold, <b>&amp;l</b> bold, <b>&amp;r</b> reset...</label>
    <div class="palette" id="s-palette"></div>
    <input type="text" class="mcfield" id="s-styled" maxlength="120" placeholder="&6&lBob's &r&eBakery" style="width:100%">
    <div class="preview" id="s-styled-prev"></div>

    <label for="s-desc">Description (optional, same colour codes work)</label>
    <textarea class="mcfield" id="s-desc" maxlength="500" placeholder="What do you sell? Where in the city are you? Anything people should know."></textarea>
    <div class="preview" id="s-desc-prev"></div>

    <label for="s-find">Find me (optional)</label>
    <input type="text" id="s-find" maxlength="120" placeholder="e.g. 2nd floor, blue wool \u00b7 underground entrance" style="width:100%">

    <label>Shop picture</label>
    <div class="row">
      <span id="s-iconprev"></span>
      <button type="button" id="s-pick-icon">Use an item as the icon</button>
      <input type="file" id="s-file" accept="image/png,image/jpeg,image/webp">
      <button type="button" id="s-clear-icon" data-ico="x" title="Clear icon" aria-label="Clear icon" hidden></button>
    </div>
    <p class="meta" style="margin:4px 0 0">Upload overrides the item icon. Default is a chest.</p>

    <div class="row" style="margin-top:12px">
      <button class="primary" id="add-shop">Create shop</button>
      <button type="button" class="small" id="cancel-new-shop">Cancel</button>
    </div>
  </div>
  </div>
  <div class="msg" id="msg"></div>

  <p class="meta" style="margin:10px 0 0">Each listing: buy &rarr; sell. Hover icons for tips.</p>
  <div id="shops"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../config.js"></script>
<script src="../items.js"></script>
<script src="../item-picker.js"></script>
<script src="../places.js"></script>
<script src="../place-picker.js"></script>
<script src="../app.js?v=25"></script>
<script>
let me = null;
let shopsData = {};                 // shop id -> shop (with listings), from the last load
let stockUndo = {};                 // shop id -> [{id, stock, in_stock, group_name}] snapshot for undo
let addingListingSlot = null;       // { shopId, groupKey } when + add form is open
let openSaleForms = new Set();      // shop ids with start-sale form expanded
let lastField = null;               // last colour-code text box you clicked in
let marketByItem = {};              // for owner price alerts
let ownerAlertList = [];
let myNotifications = [];
let dashDirty = false;              // unsaved listing / shop-detail edits
const msg = document.getElementById("msg");

/** Head-admin-only gate for auto-stock opt-in UI (DB trigger also enforces is_head). */
function autoStockUi() {
  return typeof AUTO_STOCK_UI !== "undefined" && !!AUTO_STOCK_UI && !!(me && me.profile && me.profile.is_head);
}

function markDashDirty() { dashDirty = true; }
function clearDashDirty() { dashDirty = false; }
async function confirmLeaveDash() {
  if (!dashDirty) return true;
  return confirmModal({
    title: "Unsaved changes",
    body: "You have unsaved listing or shop edits on this page. Leave anyway?",
    confirmLabel: "Leave",
    danger: true
  });
}
window.addEventListener("beforeunload", e => {
  if (!dashDirty) return;
  e.preventDefault();
  e.returnValue = "";
});
document.addEventListener("click", async e => {
  const a = e.target.closest("a[href]");
  if (!a || !dashDirty) return;
  if (a.target === "_blank" || a.hasAttribute("download")) return;
  const href = a.getAttribute("href") || "";
  if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
  try {
    const url = new URL(href, location.href);
    if (url.pathname === location.pathname && url.search === location.search) return;
  } catch (err) {}
  e.preventDefault();
  e.stopPropagation();
  if (await confirmLeaveDash()) {
    clearDashDirty();
    location.href = a.href;
  }
}, true);

const unitSelect = (cls, sel) => `<select class="unit ${cls}" title="unit (blank = single items)">
  <option value=""></option><option value="ci"${sel === "ci" ? " selected" : ""}>CI</option><option value="cs"${sel === "cs" ? " selected" : ""}>CS</option></select>`;
const unitText = u => u ? " " + u.toUpperCase() : "";
const fmtListing = l => `${l.want_amount}${unitText(l.want_unit)} ${formatItemName(l.want_item)} \u2192 ${l.sell_amount}${unitText(l.sell_unit)} ${formatItemName(l.sell_item)}`;

async function loadMarketForAlerts() {
  marketByItem = {};
  try {
    const { data } = await sb.rpc("market_now");
    (data || []).forEach(m => { (marketByItem[m.item] = marketByItem[m.item] || { sell: null, buy: null })[m.side] = m; });
  } catch (e) {}
}

function paintOwnerAlerts(shops) {
  const box = document.getElementById("owner-alerts");
  const badge = document.getElementById("alert-badge");
  if (!alertsEnabled(me && me.profile)) {
    ownerAlertList = [];
    box.hidden = true;
    box.innerHTML = "";
    badge.hidden = true;
    return;
  }
  ownerAlertList = collectOwnerAlerts(shops, marketByItem);
  if (!ownerAlertList.length) {
    box.hidden = true;
    box.innerHTML = "";
    badge.hidden = true;
    return;
  }
  badge.hidden = false;
  badge.textContent = String(ownerAlertList.length);
  box.hidden = false;
  const kindTag = k => k === "stale" ? "warn" : k === "overprice" ? "bad" : "warn";
  const kindLabel = k => k === "stale" ? "stale" : k === "overprice" ? "price" : "restock";
  box.innerHTML = `<div class="owner-alerts-head"><b>Owner alerts</b>
    <span class="meta">${ownerAlertList.length} need attention</span>
    <a class="small" href="../settings/">Settings</a></div>` +
    ownerAlertList.map((a, i) => `<div class="owner-alert" data-alert="${i}">
      <span class="tag ${kindTag(a.kind)}">${kindLabel(a.kind)}</span>
      <span class="owner-alert-body"><a href="${shopPath(a.shop, { listing: a.listing.id })}">${esc(a.shop.name)}</a>
        \u00b7 ${esc(a.text)}</span>
      <button type="button" class="small" data-act="ignore-alert" data-i="${i}">Ignore</button>
    </div>`).join("");
}

async function paintNotifications() {
  const box = document.getElementById("notifications");
  if (!box || !me) return;
  const { data } = await loadMyNotifications(me.session.user.id, 30);
  myNotifications = data || [];
  const invites = myNotifications.filter(n => n.type === "sale_invite" && !n.read_at);
  const others = myNotifications.filter(n => !n.read_at && n.type !== "sale_invite");
  if (!invites.length && !others.length) {
    box.hidden = true;
    box.innerHTML = "";
    return;
  }
  box.hidden = false;
  let html = `<div class="owner-alerts-head"><b>Notifications</b>
    <span class="meta">${invites.length + others.length} unread</span></div>`;
  invites.forEach(n => {
    const p = n.payload || {};
    const scope = p.scope === "nation" ? ("nation " + (p.nation || "?")) : "server-wide";
    const pct = p.percent_off != null ? (p.percent_off + "% off") : (p.label || "sale");
    html += `<div class="owner-alert" data-note="${n.id}">
      <span class="tag sale">sale</span>
      <span class="owner-alert-body"><b>${esc(p.name || "Sale")}</b> (${esc(scope)}, ${esc(String(pct))})  - 
        There is a sale happening, want to participate?</span>
      <button type="button" class="small primary" data-act="sale-yes" data-note="${n.id}">Yes</button>
      <button type="button" class="small" data-act="sale-no" data-note="${n.id}">No</button>
    </div>`;
  });
  others.forEach(n => {
    html += `<div class="owner-alert" data-note="${n.id}">
      <span class="tag">${esc(n.type)}</span>
      <span class="owner-alert-body">${esc(JSON.stringify(n.payload || {}))}</span>
      <button type="button" class="small" data-act="note-read" data-note="${n.id}">Dismiss</button>
    </div>`;
  });
  box.innerHTML = html;
  if (location.hash === "#notifications") box.scrollIntoView({ block: "start" });
}

function salePanelHtml(s) {
  if (shopSaleActive(s)) {
    const until = s.sale_ends_at ? (" until " + new Date(s.sale_ends_at).toLocaleString()) : " (until cancelled)";
    const pct = s.sale_percent != null ? (s.sale_percent + "% off \u00b7 ") : "";
    return `<div class="sale-panel sale-panel-active">
      ${saleBadgeHtml(s)} <span class="meta">${esc(pct)}active${esc(until)}</span>
    </div>`;
  }
  const open = openSaleForms.has(String(s.id));
  return `<div class="sale-panel" data-sale-form="${s.id}"${open ? "" : " hidden"}>
    <div class="row" style="flex-wrap:wrap">
      <input type="text" class="sale-name" maxlength="60" placeholder="Sale name" style="width:140px">
      <input type="number" class="sale-pct" min="1" max="99" step="1" placeholder="% off" style="width:72px" title="Optional percent off diamond prices">
      <input type="datetime-local" class="sale-end" title="End time (optional - leave blank until cancelled)">
      <button type="button" class="small primary" data-act="start-sale">Start sale</button>
      <button type="button" class="small" data-act="toggle-sale">Cancel</button>
    </div>
    <p class="meta" style="margin:4px 0 0">Diamond listings get % off (original prices stored for restore). Public cards show "(Name) sale!".</p>
  </div>`;
}

function setNewShopOpen(open) {
  const wrap = document.getElementById("newshop-wrap");
  const toggle = document.getElementById("toggle-new-shop");
  if (!wrap || !toggle) return;
  wrap.hidden = !open;
  toggle.hidden = open;
  if (open) {
    const name = document.getElementById("s-name");
    if (name && !name.disabled) name.focus();
  }
}

async function load() {
  const ctx = await requireLogin();
  if (!ctx) return;
  me = ctx;
  document.getElementById("who").textContent = "Logged in as " + userName(ctx.profile);

  document.getElementById("toggle-new-shop").onclick = () => setNewShopOpen(true);
  document.getElementById("cancel-new-shop").onclick = () => setNewShopOpen(false);

  if (!isVerified(ctx.profile)) {
    document.getElementById("verify").innerHTML = `
      <div class="banner"><b>Account not verified.</b> You can browse, favourite, and report, but not create shops, comment, review, or upload. <a href="../verify/">Verify here</a> (${PFA_HELP}).</div>`;
    document.querySelectorAll("#newshop input, #newshop textarea, #newshop button").forEach(el => el.disabled = true);
  }
  setupNewShopForm();
  await loadMarketForAlerts();
  await paintNotifications();
  render();
}

function refreshNewIconPrev() {
  const panel = document.getElementById("newshop");
  const item = panel.dataset.iconItem || "";
  document.getElementById("s-iconprev").innerHTML = shopIcon({ icon_item: item || null, icon_path: null }, "card");
  document.getElementById("s-clear-icon").hidden = !item;
}

function updateNewPreview(field, prevId) {
  const prev = document.getElementById(prevId);
  const v = field.value;
  if (v.trim()) prev.innerHTML = mcText(v);
  else if (field.id === "s-styled") prev.innerHTML = '<span class="meta">Preview. Leave empty to show the plain name.</span>';
  else prev.innerHTML = '<span class="meta">Preview</span>';
}

function setupNewShopForm() {
  const panel = document.getElementById("newshop");
  if (panel.dataset.ready) return;
  panel.dataset.ready = "1";
  document.getElementById("s-palette").innerHTML = paletteHtml();
  refreshNewIconPrev();
  updateNewPreview(document.getElementById("s-styled"), "s-styled-prev");
  updateNewPreview(document.getElementById("s-desc"), "s-desc-prev");

  panel.addEventListener("focusin", e => {
    if (e.target.classList.contains("mcfield")) lastField = e.target;
  });
  panel.addEventListener("input", e => {
    if (e.target.id === "s-styled") updateNewPreview(e.target, "s-styled-prev");
    if (e.target.id === "s-desc") updateNewPreview(e.target, "s-desc-prev");
  });
  panel.addEventListener("click", e => {
    const cb = e.target.closest("button[data-code]");
    if (cb) {
      const field = lastField && panel.contains(lastField) ? lastField : document.getElementById("s-styled");
      insertMcCode(field, cb.dataset.code);
      if (field.value.length > field.maxLength) field.value = field.value.slice(0, field.maxLength);
      updateNewPreview(field, field.id === "s-styled" ? "s-styled-prev" : "s-desc-prev");
      return;
    }
  });
  document.getElementById("s-pick-icon").onclick = () => {
    openItemPicker(name => {
      panel.dataset.iconItem = name;
      refreshNewIconPrev();
    });
  };
  document.getElementById("s-clear-icon").onclick = () => {
    panel.dataset.iconItem = "";
    document.getElementById("s-file").value = "";
    refreshNewIconPrev();
  };
  if (typeof bindPlaceFieldsIn === "function") bindPlaceFieldsIn(panel);
}

function setPick(btn, name) {
  btn.dataset.value = name;
  btn.innerHTML = `<img src="${esc(itemImg(name))}" alt=""> ${esc(formatItemName(name))}`;
}
const pickBtn = (which, name) => name
  ? `<button type="button" class="pickbtn" data-act="pick" data-pick="${which}" data-value="${esc(name)}"><img src="${esc(itemImg(name))}" alt=""> ${esc(formatItemName(name))}</button>`
  : `<button type="button" class="pickbtn" data-act="pick" data-pick="${which}">Pick item you're ${which === "sell" ? "selling" : "buying"}</button>`;

function panelHtml(s) {
  const iconPrev = shopIcon({ icon_item: s.icon_item, icon_path: s.icon_path }, "card");
  return `
  <div class="panel" data-panel="${s.id}" data-icon-item="${esc(s.icon_item || "")}" hidden>
    <div class="row">
      <div style="flex:2;min-width:180px"><label>Shop name (plain text, this is what people search)</label><input type="text" class="p-name" maxlength="60" value="${esc(s.name)}" style="width:100%"></div>
      <div style="flex:1;min-width:120px"><label>City</label><input type="text" class="p-city place-city" maxlength="60" value="${esc(s.city || "")}" placeholder="Search citiesΓÇª" style="width:100%"></div>
      <div style="flex:1;min-width:120px"><label>Nation</label><input type="text" class="p-nation place-nation" maxlength="60" value="${esc(s.nation || "")}" placeholder="Search nationsΓÇª" style="width:100%"></div>
      <div><label>X</label><input type="number" class="p-x" value="${s.x ?? ""}" style="width:90px"></div>
      <div><label>Z</label><input type="number" class="p-z" value="${s.z ?? ""}" style="width:90px"></div>
    </div>
    ${autoStockUi() ? `
    <div class="dash-auto-stock" style="margin-top:10px">
      <label class="find-filter-check" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" class="p-auto-stock" ${s.auto_stock_enabled ? "checked" : ""}>
        Auto stock updates (CivMC Shop Scan mod)
      </label>
      <p class="meta" style="margin:4px 0 0">Head admin only for now. Needs shop X/Z. Crowd-sourced stock from the mod (trade + punch coords).</p>
    </div>` : ""}

    <label>Fancy name (optional). Minecraft colour codes: <b>&amp;6</b> gold, <b>&amp;l</b> bold, <b>&amp;r</b> reset...</label>
    <div class="palette">${paletteHtml()}</div>
    <input type="text" class="mcfield p-styled" maxlength="120" placeholder="&6&lBob's &r&eBakery" value="${esc(s.styled_name || "")}" style="width:100%">
    <div class="preview"></div>

    <label>Description (optional, same colour codes work)</label>
    <textarea class="mcfield p-desc" maxlength="500" placeholder="What do you sell? Where in the city are you? Anything people should know.">${esc(s.description || "")}</textarea>
    <div class="preview"></div>

    <label>Find me (optional)</label>
    <input type="text" class="p-find" maxlength="120" value="${esc(s.find_note || "")}" placeholder="e.g. 2nd floor, blue wool" style="width:100%">

    <label>Shop picture</label>
    <div class="row">
      <span class="p-iconprev">${iconPrev}</span>
      <button type="button" data-act="pick-icon">Use an item as the icon</button>
      <input type="file" class="p-file" accept="image/png,image/jpeg,image/webp">
      ${s.icon_path ? iconBtn("trash", { danger: true, title: "Remove uploaded picture", attrs: 'data-act="remove-pic"' }) : ""}
    </div>
    <p class="meta" style="margin:4px 0 0">An uploaded picture is used instead of the item icon. With neither, your shop gets a chest.</p>

    <div class="row" style="margin-top:10px">
      <button type="button" class="primary small" data-act="save-shop">Save details</button>
      ${iconBtn("x", { title: "Close", attrs: 'data-act="close-panel"' })}
    </div>
  </div>`;
}

function dashListingOut(l) {
  return l.in_stock === false || l.stock === 0;
}

function readAltWantsFromRow(root) {
  const rows = [...root.querySelectorAll(".dash-alt-want")];
  const alts = [];
  rows.forEach(row => {
    const item = norm(row.dataset.wantItem || "");
    const amount = parseInt(row.querySelector(".dash-alt-wa")?.value, 10);
    const unit = row.querySelector(".dash-alt-wu")?.value || "";
    if (!item || !(amount > 0)) return;
    alts.push({ item, amount, unit: unit === "ci" || unit === "cs" ? unit : "" });
  });
  return normalizeAltWants(alts);
}

function syncDashListingExtraVisibility(row) {
  const sell = row.dataset.sellItem || "";
  const want = row.dataset.wantItem || "";
  const showBundle = isBundleItem(sell) || isBundleItem(want);
  const showEnchants = isEnchantableItem(sell) || isEnchantableItem(want);
  const bundleRow = row.querySelector(".dash-bundle-row");
  if (bundleRow) bundleRow.hidden = !showBundle;
  if (!showBundle) row.dataset.bundleContents = "";
  const enchLabel = row.querySelector(".dash-enchants-label");
  if (enchLabel) enchLabel.hidden = !showEnchants;
}

function listingFieldsFromRow(root, shop) {
  const src = (shop.listings || []).find(x => listingIdEq(x.id, root.dataset.listing));
  const gn = src ? (src.group_name == null ? null : (String(src.group_name).trim() || null)) : null;
  let bundle_contents = src ? normalizeBundleContents(src.bundle_contents) : null;
  if (root.dataset.bundleContents != null && root.dataset.bundleContents !== "") {
    try { bundle_contents = normalizeBundleContents(JSON.parse(root.dataset.bundleContents)); }
    catch (e) { /* keep src */ }
  } else if (root.dataset.bundleContents === "") {
    bundle_contents = null;
  }
  const wi = root.dataset.wantItem || "";
  const si = root.dataset.sellItem || "";
  const canEnchant = isEnchantableItem(si) || isEnchantableItem(wi);
  const canBundle = isBundleItem(si) || isBundleItem(wi);
  return {
    wa: parseInt(root.querySelector(".dash-wa").value, 10),
    sa: parseInt(root.querySelector(".dash-sa").value, 10),
    wi, si,
    wu: root.querySelector(".dash-wu").value,
    su: root.querySelector(".dash-su").value,
    stock: parseStockInput(root.querySelector(".dash-stock-amt").value),
    group_name: gn,
    enchants: canEnchant ? normalizeListingEnchants(root.querySelector(".dash-enchants")?.value || "") : null,
    notes: normalizeListingNotes(root.querySelector(".dash-notes")?.value || ""),
    bundle_contents: canBundle ? bundle_contents : null,
    alt_wants: readAltWantsFromRow(root),
    x: (() => {
      const el = root.querySelector(".dash-lx");
      if (!el || el.value === "") return null;
      const n = parseInt(el.value, 10);
      return Number.isFinite(n) ? n : null;
    })(),
    z: (() => {
      const el = root.querySelector(".dash-lz");
      if (!el || el.value === "") return null;
      const n = parseInt(el.value, 10);
      return Number.isFinite(n) ? n : null;
    })()
  };
}

function listingBundleKey(v) {
  return JSON.stringify(normalizeBundleContents(v) || null);
}

function listingAltKey(v) {
  return JSON.stringify(normalizeAltWants(v) || null);
}

function listingRowMatchesFields(l, f) {
  let ok = l.want_amount === f.wa && l.sell_amount === f.sa
    && (l.want_unit || "") === f.wu && (l.sell_unit || "") === f.su
    && l.want_item === f.wi && l.sell_item === f.si
    && (l.stock ?? null) === (f.stock ?? null)
    && l.in_stock === inStockFromStock(f.stock)
    && (l.group_name || null) === f.group_name
    && (normalizeListingEnchants(l.enchants) || null) === (f.enchants || null)
    && (normalizeListingNotes(l.notes) || null) === (f.notes || null)
    && listingBundleKey(l.bundle_contents) === listingBundleKey(f.bundle_contents)
    && listingAltKey(l.alt_wants) === listingAltKey(f.alt_wants);
  if (autoStockUi()) {
    ok = ok && (l.x ?? null) === (f.x ?? null) && (l.z ?? null) === (f.z ?? null);
  }
  return ok;
}

async function commitListingRow(root, shop, shopId) {
  const lid = Number(root.dataset.listing);
  const src = (shop.listings || []).find(x => x.id === lid);
  if (!src) return { ok: false };
  const f = listingFieldsFromRow(root, shop);
  if (!(f.wa > 0) || !(f.sa > 0) || !f.wi || !f.si) {
    setMsg(msg, "Both items need amounts and an item picked.", "err");
    return { ok: false };
  }
  if (listingRowMatchesFields(src, f)) return { ok: true, skipped: true };
  if (!await dupOk(shop, f, lid, "Save")) return { ok: false };
  if (!await marketPriceWarnOk(f)) return { ok: false };
  const in_stock = inStockFromStock(f.stock);
  const patch = {
    sell_item: f.si, sell_amount: f.sa, sell_unit: f.su,
    want_item: f.wi, want_amount: f.wa, want_unit: f.wu,
    stock: f.stock, in_stock, group_name: f.group_name,
    enchants: f.enchants, notes: f.notes, bundle_contents: f.bundle_contents,
    alt_wants: f.alt_wants,
    updated_at: new Date().toISOString()
  };
  if (autoStockUi()) {
    patch.x = f.x;
    patch.z = f.z;
  }
  const res = await sb.from("listings").update(patch).eq("id", lid);
  if (res.error) {
    setMsg(msg, res.error.message, "err");
    return { ok: false };
  }
  Object.assign(src, {
    sell_item: f.si, sell_amount: f.sa, sell_unit: f.su,
    want_item: f.wi, want_amount: f.wa, want_unit: f.wu,
    stock: f.stock, in_stock, group_name: f.group_name,
    enchants: f.enchants, notes: f.notes, bundle_contents: f.bundle_contents,
    alt_wants: f.alt_wants
  });
  if (autoStockUi()) {
    src.x = f.x;
    src.z = f.z;
  }
  return { ok: true };
}

    <button type="button" class="small ico-label" data-act="add-group">${uiIcon("plus")} Add group</button>
  </div><div class="dash-listings-root">`;
  sections.forEach(sec => {
    const inGroup = sorted.filter(l => String(l.group_name || "").trim() === sec.key);
    const slotOpen = addingListingSlot
      && String(addingListingSlot.shopId) === String(shop.id)
      && addingListingSlot.groupKey === sec.key;
    const collapseId = dashGroupCollapseId(shop.id, sec.key);
    const bodyId = collapseId + "-body";
    const blockAttrs = sec.showHead
      ? ` class="dash-group-block collapse-section" data-collapse="${esc(collapseId)}" data-group-key="${esc(sec.key)}"`
      : ` class="dash-group-block" data-group-key="${esc(sec.key)}"`;
    html += `<div${blockAttrs}>`;
    if (sec.showHead) html += dashGroupHeadHtml(shop, sec.key, sec.label);
    html += `<div class="collapse-body dash-group-body" id="${esc(bodyId)}">`;

    inGroup.forEach(l => { html += dashListingCard(l); });

  return html;
}

async function expirePastSales(shops) {
  const now = Date.now();
  for (const s of shops || []) {
    if (!s.sale_active || !s.sale_ends_at) continue;
    if (Date.parse(s.sale_ends_at) >= now) continue;
    await endShopSale(s.id);
    s.sale_active = false;
  }
}

const DASH_SHOP_SELECT = "*, listings(*), shop_members(user_id, role, created_at, profiles(username, mc_username, avatar_path, is_business, is_nation))";

async function loadEditableShops() {
  const uid = me.session.user.id;
  const ownedRes = await sb.from("shops").select(DASH_SHOP_SELECT).eq("owner_id", uid).order("created_at");
  if (ownedRes.error) return ownedRes;
  const memberRes = await sb.from("shop_members").select("shop_id").eq("user_id", uid).eq("role", "co_owner");
  if (memberRes.error) return memberRes;
  const have = new Set((ownedRes.data || []).map(s => String(s.id)));
  const ids = (memberRes.data || []).map(m => m.shop_id).filter(id => !have.has(String(id)));
  let extra = [];
  if (ids.length) {
    const coRes = await sb.from("shops").select(DASH_SHOP_SELECT).in("id", ids);
    if (coRes.error) return coRes;
    extra = coRes.data || [];
  }
  const shops = [...(ownedRes.data || []), ...extra];
  shops.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  return { data: shops, error: null };
}

}

function updatePreview(field) {
  const prev = field.nextElementSibling;
  if (!prev || !prev.classList.contains("preview")) return;
  const v = field.value;
  if (v.trim()) prev.innerHTML = mcText(v);
  else if (field.classList.contains("p-styled")) prev.innerHTML = `<span class="meta">Preview. Leave empty to show the plain name.</span>`;
  else prev.innerHTML = `<span class="meta">Preview</span>`;
}

// ---- duplicate warning: same sell item + want item already in this shop
async function dupOk(shop, f, ignoreId, verb) {
  const same = shop.listings.filter(l => l.id !== ignoreId && l.sell_item === f.si && l.want_item === f.wi);
  if (!same.length) return true;
  const exact = same.some(l => l.sell_amount === f.sa && (l.sell_unit || "") === f.su && l.want_amount === f.wa && (l.want_unit || "") === f.wu);
  return confirmModal({
    title: "Similar listing exists",
    body: exact
      ? `You already have this exact listing:\n${fmtListing(same[0])}\n\n${verb} anyway?`
      : `You already have a listing for ${f.si} \u2192 ${f.wi}:\n${same.map(fmtListing).join("\n")}\n\n${verb} this one anyway?`,
    confirmLabel: verb
  });
}

}

function listingIdEq(a, b) {
  return String(a) === String(b);
}

function dashGroupListEl(from) {
  const block = from.closest(".dash-group-block");
  return block ? block.querySelector(".dash-listing-list") : null;
}

function listingDisplaySnapshot(listings) {
  // Capture sort/group BEFORE any drag mutate ΓÇö shared refs would hide the patch.
  return new Map((listings || []).map(l => [String(l.id), {
    sort_order: l.sort_order,
    group_name: l.group_name == null ? null : (String(l.group_name).trim() || null)
  }]));
}

function listingsOrderCopy(listings, shop) {
  return sortListingsOwnerOrder(listings || [], shop).map(l => ({ ...l }));
}

async function applyListingDisplayOrder(shop, order, beforeSnap) {
  const before = beforeSnap || listingDisplaySnapshot(shop.listings);
  for (let i = 0; i < order.length; i++) {
    const l = order[i];
    const was = before.get(String(l.id));
    if (!was) continue;
    const gn = l.group_name == null ? null : (String(l.group_name).trim() || null);
    const patch = {};
    const prevSort = was.sort_order == null ? null : Number(was.sort_order);
    if (prevSort !== i) patch.sort_order = i;
    if ((was.group_name || null) !== (gn || null)) patch.group_name = gn;
    l.sort_order = i;
    l.group_name = gn;
    if (Object.keys(patch).length) {
      const r = await sb.from("listings").update(patch).eq("id", l.id);
      if (r.error) return r.error.message;
    }
  }
  shop.listings = order.slice();
  return null;
}

async function reorderListingDrag(shop, fromId, toId) {
  const before = listingDisplaySnapshot(shop.listings);
  const order = listingsOrderCopy(shop.listings, shop);
  const fromIdx = order.findIndex(l => listingIdEq(l.id, fromId));
  let toIdx = order.findIndex(l => listingIdEq(l.id, toId));
  if (fromIdx < 0 || toIdx < 0) return "Listing not found.";
  const targetGroup = order[toIdx].group_name;
  const [item] = order.splice(fromIdx, 1);
  toIdx = order.findIndex(l => listingIdEq(l.id, toId));
  if (toIdx < 0) return "Listing not found.";
  item.group_name = normalizeListingGroup(targetGroup);
  order.splice(toIdx, 0, item);
  return applyListingDisplayOrder(shop, order, before);
}

async function moveListingToGroupEnd(shop, fromId, groupKeyRaw) {
  const before = listingDisplaySnapshot(shop.listings);
  const newGroup = normalizeListingGroup(groupKeyRaw);
  const gKey = String(newGroup || "");
  const order = listingsOrderCopy(shop.listings, shop);
  const fromIdx = order.findIndex(l => listingIdEq(l.id, fromId));
  if (fromIdx < 0) return "Listing not found.";
  const [item] = order.splice(fromIdx, 1);
  item.group_name = newGroup;
  let insertAt = -1;
  for (let i = order.length - 1; i >= 0; i--) {
    if (String(order[i].group_name || "").trim() === gKey) {
      insertAt = i + 1;
      break;
    }
  }
  if (insertAt < 0) {
    if (!gKey) insertAt = order.length;
    else {
      const named = orderedNamedGroups(order, shop);
      const gi = named.indexOf(gKey);
      insertAt = order.length;
      for (let j = gi + 1; j < named.length; j++) {
        const idx = order.findIndex(l => String(l.group_name || "").trim() === named[j]);
        if (idx >= 0) { insertAt = idx; break; }
      }
      if (insertAt === order.length) {
        const u = order.findIndex(l => !String(l.group_name || "").trim());
        if (u >= 0) insertAt = u;
      }
    }
  }
  order.splice(insertAt, 0, item);
  return applyListingDisplayOrder(shop, order, before);
}

function clearListingDragMarkers() {
  shopsRoot.querySelectorAll(".dash-listing-card.drag-over, .dash-listing-list.drag-over-group, .dash-group-head.drag-over-group, .dash-group-block.drag-over-group")
    .forEach(el => el.classList.remove("drag-over", "drag-over-group"));
}

function clearGroupDragMarkers() {
  shopsRoot.querySelectorAll(".dash-group-block.drag-over-reorder")
    .forEach(el => el.classList.remove("drag-over-reorder"));
}

async function reorderNamedGroupDrag(shop, fromKey, toKey) {
  const from = String(fromKey || "").trim();
  const to = String(toKey || "").trim();
  if (!from || !to || from === to) return null;
  const names = orderedNamedGroups(shop.listings, shop).slice();
  const fromIdx = names.indexOf(from);
  let toIdx = names.indexOf(to);
  if (fromIdx < 0 || toIdx < 0) return "Group not found.";
  const [item] = names.splice(fromIdx, 1);
  toIdx = names.indexOf(to);
  if (toIdx < 0) return "Group not found.";
  names.splice(toIdx, 0, item);
  const r = await sb.from("shops").update({ group_order: names }).eq("id", shop.id);
  if (r.error) return r.error.message;
  shop.group_order = names;
  return null;
}

let dragListingId = null;
let dragShopId = null;
let dragPayload = null;
let dragGroupKey = null;
let dragGroupShopId = null;
let dragGroupPayload = null;
const shopsRoot = document.getElementById("shops");
const DND_MIME = "application/x-civmc-listing";
const DND_GROUP_MIME = "application/x-civmc-group";

function readListingDragPayload(e) {
  try {
    const raw = e.dataTransfer.getData(DND_MIME) || e.dataTransfer.getData("text/plain");
    if (raw) {
      if (raw.startsWith("{")) return JSON.parse(raw);
      return { listingId: raw, shopId: dragShopId };
    }
  } catch (err) { /* fall through */ }
  return dragPayload || (dragListingId ? { listingId: dragListingId, shopId: dragShopId } : null);
}

function readGroupDragPayload(e) {
  try {
    const raw = e.dataTransfer.getData(DND_GROUP_MIME);
    if (raw && raw.startsWith("{")) return JSON.parse(raw);
  } catch (err) { /* fall through */ }
  return dragGroupPayload || (dragGroupKey ? { groupKey: dragGroupKey, shopId: dragGroupShopId } : null);
}

function clearListingDragState() {
  shopsRoot.querySelectorAll(".dash-listing-card.is-dragging").forEach(c => c.classList.remove("is-dragging"));
  clearListingDragMarkers();
  dragListingId = null;
  dragShopId = null;
  dragPayload = null;
}

function clearGroupDragState() {
  shopsRoot.querySelectorAll(".dash-group-block.is-dragging-group").forEach(c => c.classList.remove("is-dragging-group"));
  clearGroupDragMarkers();
  dragGroupKey = null;
  dragGroupShopId = null;
  dragGroupPayload = null;
}

shopsRoot.addEventListener("dragstart", e => {
  const groupHandle = e.target.closest(".dash-group-drag-handle");
  if (groupHandle) {
    const block = groupHandle.closest(".dash-group-block");
    const shopEl = groupHandle.closest("[data-shop]");
    const groupKey = block && String(block.getAttribute("data-group-key") || "").trim();
    if (!block || !shopEl || !groupKey) return;
    const payload = { groupKey, shopId: shopEl.dataset.shop };
    dragGroupKey = payload.groupKey;
    dragGroupShopId = payload.shopId;
    dragGroupPayload = payload;
    clearListingDragState();
    e.dataTransfer.setData(DND_GROUP_MIME, JSON.stringify(payload));
    e.dataTransfer.setData("text/plain", "group:" + payload.groupKey);
    e.dataTransfer.effectAllowed = "move";
    block.classList.add("is-dragging-group");
    return;
  }
  const handle = e.target.closest(".dash-drag-handle");
  if (!handle || handle.classList.contains("dash-group-drag-handle")) return;
  const card = handle.closest(".dash-listing-card");
  const shopEl = handle.closest("[data-shop]");
  if (!card || !shopEl) return;
  const payload = { listingId: card.dataset.listing, shopId: shopEl.dataset.shop };
  dragListingId = payload.listingId;
  dragShopId = payload.shopId;
  dragPayload = payload;
  clearGroupDragState();
  e.dataTransfer.setData(DND_MIME, JSON.stringify(payload));
  e.dataTransfer.setData("text/plain", JSON.stringify(payload));
  e.dataTransfer.effectAllowed = "move";
  card.classList.add("is-dragging");
});
shopsRoot.addEventListener("dragend", () => {
  clearListingDragState();
  clearGroupDragState();
});
shopsRoot.addEventListener("dragenter", e => {
  if (!dragListingId && !dragGroupKey) return;
  e.preventDefault();
});
shopsRoot.addEventListener("dragover", e => {
  if (dragGroupKey) {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    clearGroupDragMarkers();
    const block = e.target.closest(".dash-group-block");
    if (!block) return;
    const key = String(block.getAttribute("data-group-key") || "").trim();
    if (!key || key === dragGroupKey) return;
    const shopEl = block.closest("[data-shop]");
    if (!shopEl || String(shopEl.dataset.shop) !== String(dragGroupShopId)) return;
    block.classList.add("drag-over-reorder");
    return;
  }
  if (!dragListingId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  clearListingDragMarkers();
  const card = e.target.closest(".dash-listing-card");
  if (card && !listingIdEq(card.dataset.listing, dragListingId)) {
    card.classList.add("drag-over");
    return;
  }
  const block = e.target.closest(".dash-group-block");
  if (block) {
    block.classList.add("drag-over-group");
    const list = block.querySelector(".dash-listing-list");
    if (list) list.classList.add("drag-over-group");
  }
});
shopsRoot.addEventListener("drop", async e => {
  e.preventDefault();
  e.stopPropagation();
  if (dragGroupKey || (e.dataTransfer && e.dataTransfer.types && [...e.dataTransfer.types].includes(DND_GROUP_MIME))) {
    const gPayload = readGroupDragPayload(e);
    clearGroupDragMarkers();
    if (!gPayload || !gPayload.groupKey || gPayload.shopId == null) {
      clearGroupDragState();
      return;
    }
    const shop = shopsData[gPayload.shopId] || shopsData[String(gPayload.shopId)];
    const targetBlock = e.target.closest(".dash-group-block");
    const toKey = targetBlock ? String(targetBlock.getAttribute("data-group-key") || "").trim() : "";
    clearGroupDragState();
    if (!shop || !toKey || toKey === gPayload.groupKey) return;
    const err = await reorderNamedGroupDrag(shop, gPayload.groupKey, toKey);
    if (err) { setMsg(msg, err, "err"); return; }
    setMsg(msg, "Group order saved.", "ok");
    render();
    return;
  }
  const payload = readListingDragPayload(e);
  clearListingDragMarkers();
  if (!payload || payload.listingId == null || payload.shopId == null) {
    clearListingDragState();
    return;
  }
  const shop = shopsData[payload.shopId] || shopsData[String(payload.shopId)];
  if (!shop) {
    clearListingDragState();
    return;
  }
  let err = null;
  let didMove = false;
  const fromId = payload.listingId;
  const targetCard = e.target.closest(".dash-listing-card");
  if (targetCard && !listingIdEq(targetCard.dataset.listing, fromId)) {
    err = await reorderListingDrag(shop, fromId, targetCard.dataset.listing);
    didMove = !err;
  } else {
    const list = e.target.closest(".dash-listing-list") || dashGroupListEl(e.target);
    if (list) {
      const groupKey = list.getAttribute("data-group-name");
      err = await moveListingToGroupEnd(shop, fromId, groupKey == null ? "" : groupKey);
      didMove = !err;
    }
  }
  clearListingDragState();
  if (didMove) {
    setMsg(msg, "Listing moved.", "ok");
    render();
    return;
  }
  if (err) setMsg(msg, err, "err");
});

// live preview + remember which colour-code box you're in
document.getElementById("shops").addEventListener("input", e => { if (e.target.classList.contains("mcfield")) updatePreview(e.target); });
document.getElementById("shops").addEventListener("focusin", e => { if (e.target.classList.contains("mcfield")) lastField = e.target; });

document.getElementById("notifications").addEventListener("click", async e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const noteId = Number(btn.dataset.note);
  const note = myNotifications.find(n => String(n.id) === String(noteId));
  if (!note) return;
  if (btn.dataset.act === "sale-yes") {
    const shops = Object.values(shopsData);
    const r = await acceptSaleInvite(note, shops);
    if (r.error) { setMsg(msg, r.error, "err"); return; }
    setMsg(msg, "Joined sale on " + r.joined + " shop" + (r.joined === 1 ? "" : "s") + ".", "ok");
    await paintNotifications();
    render();
    return;
  }
  if (btn.dataset.act === "sale-no") {
    await declineSaleInvite(note);
    setMsg(msg, "Sale invite declined.", "ok");
    await paintNotifications();
    return;
  }
  if (btn.dataset.act === "note-read") {
    await markNotificationRead(note.id);
    await paintNotifications();
  }
});

document.getElementById("owner-alerts").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act=ignore-alert]");
  if (!btn) return;
  const a = ownerAlertList[Number(btn.dataset.i)];
  if (!a) return;
  btn.disabled = true;
  const r = await ignoreOwnerAlert(a);
  if (r.error) { setMsg(msg, r.error, "err"); btn.disabled = false; return; }
  setMsg(msg, a.kind === "stale" ? "Stale alert ignored - 7-day clock restarted." : "Alert ignored for 7 days (or until you edit the listing).", "ok");
  render();
});

document.getElementById("shops").addEventListener("click", async e => {
  // colour-code buttons
  const cb = e.target.closest("button[data-code]");
  if (cb) {
    const panel = cb.closest("[data-panel]");
    let f = lastField && panel.contains(lastField) ? lastField : panel.querySelector(".p-styled");
    const a = f.selectionStart ?? f.value.length, b = f.selectionEnd ?? a;
    f.value = (f.value.slice(0, a) + cb.dataset.code + f.value.slice(b)).slice(0, f.maxLength);
    f.focus();
    f.setSelectionRange(a + 2, a + 2);
    updatePreview(f);
    return;
  }

  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === "pick") { openItemPicker(name => setPick(btn, name)); return; }

  const shopElEarly = btn.closest("[data-shop]");
  if (act === "share-shop" && shopElEarly) {
    const shopId = shopElEarly.dataset.shop;
    btn.disabled = true;
    const { data, error } = await sb.rpc("create_shop_invite", { sid: Number(shopId) });
    btn.disabled = false;
    if (error) { setMsg(msg, error.message, "err"); return; }
    const url = shopInviteUrl(data);
    const ok = await copyText(url);
    setMsg(msg, ok
      ? "Invite link copied. It lasts 1 hour and one player can join as a co-owner."
      : "Couldn't copy. Invite link: " + url, ok ? "ok" : "err");
    return;
  }
  if (act === "remove-coowner" && shopElEarly) {
    const shopId = shopElEarly.dataset.shop;
    const name = btn.dataset.name || "this player";
    if (!await confirmModal({
      title: "Remove co-owner",
      body: `Remove ${name} from this shop? They will no longer be able to edit it.`,
      confirmLabel: "Remove",
      danger: true
    })) return;
    const { error } = await sb.rpc("remove_shop_co_owner", { sid: Number(shopId), member_id: btn.dataset.user });
    if (error) { setMsg(msg, error.message, "err"); return; }
    setMsg(msg, "Co-owner removed.", "ok");
    render();
    return;
  }
  if (act === "leave-shop" && shopElEarly) {
    const shopId = shopElEarly.dataset.shop;
    if (!await confirmModal({
      title: "Leave shop",
      body: "You will stop being a co-owner and this shop will disappear from My Shops.",
      confirmLabel: "Leave shop",
      danger: true
    })) return;
    const { error } = await sb.rpc("leave_shop", { sid: Number(shopId) });
    if (error) { setMsg(msg, error.message, "err"); return; }
    setMsg(msg, "You left the shop.", "ok");
    render();
    return;
  }
  if (act === "open-add-listing" && shopElEarly) {
    addingListingSlot = { shopId: shopElEarly.dataset.shop, groupKey: btn.dataset.group ?? "" };
    render();
    return;
  }
  if (act === "cancel-add-listing" && shopElEarly) {
    addingListingSlot = null;
    render();
    return;
  }
  if (act === "add-group" && shopElEarly) {
    const shop = shopsData[shopElEarly.dataset.shop];
    const name = await promptModal({
      title: "New group",
      body: "Section label on your public shop page (sidebar + headings).",
      label: "Group name",
      maxLength: 60,
      confirmLabel: "Add group"
    });
    if (name == null) return;
    const trimmed = name.trim().slice(0, 60);
    if (!trimmed) { setMsg(msg, "Group name can't be empty.", "err"); return; }
    if (shopGroupSections(shop.listings, shop).some(s => s.key === trimmed)) {
      setMsg(msg, "That group already exists.", "err");
      return;
    }
    const icons = { ...normalizeGroupIcons(shop.group_icons) };
    icons[trimmed] = {};
    const group_order = appendGroupOrder(shop, trimmed);
    btn.disabled = true;
    sb.from("shops").update({ group_icons: icons, group_order }).eq("id", shopElEarly.dataset.shop).then(r => {
      btn.disabled = false;
      if (r.error) { setMsg(msg, r.error.message, "err"); return; }
      shop.group_icons = icons;
      shop.group_order = group_order;
      addingListingSlot = { shopId: shopElEarly.dataset.shop, groupKey: trimmed };
      setMsg(msg, "Group added.", "ok");
      render();
    });
    return;
  }
  if (act === "rename-group" && shopElEarly) {
    const shopId = shopElEarly.dataset.shop;
    const shop = shopsData[shopId];
    const oldName = String(btn.dataset.group || "").trim();
    if (!oldName) return;
    const name = await promptModal({
      title: "Rename group",
      body: "Updates this section label for all listings in the group.",
      label: "Group name",
      maxLength: 60,
      defaultValue: oldName,
      confirmLabel: "Rename"
    });
    if (name == null) return;
    const trimmed = name.trim().slice(0, 60);
    if (!trimmed) { setMsg(msg, "Group name can't be empty.", "err"); return; }
    if (trimmed === oldName) return;
    if (shopGroupSections(shop.listings, shop).some(s => s.key === trimmed)) {
      setMsg(msg, "That group already exists.", "err");
      return;
    }
    btn.disabled = true;
    const listRes = await sb.from("listings")
      .update({ group_name: trimmed })
      .eq("shop_id", shopId)
      .eq("group_name", oldName);
    if (listRes.error) {
      btn.disabled = false;
      setMsg(msg, listRes.error.message, "err");
      return;
    }
    const icons = { ...normalizeGroupIcons(shop.group_icons) };
    if (Object.prototype.hasOwnProperty.call(icons, oldName)) {
      icons[trimmed] = icons[oldName];
      delete icons[oldName];
    }
    const group_order = renameGroupOrderKey(shop, oldName, trimmed);
    const shopRes = await sb.from("shops").update({ group_icons: icons, group_order }).eq("id", shopId);
    btn.disabled = false;
    if (shopRes.error) { setMsg(msg, shopRes.error.message, "err"); return; }
    shop.group_icons = icons;
    shop.group_order = group_order;
    (shop.listings || []).forEach(l => {
      if (String(l.group_name || "").trim() === oldName) l.group_name = trimmed;
    });
    if (addingListingSlot
      && String(addingListingSlot.shopId) === String(shopId)
      && addingListingSlot.groupKey === oldName) {
      addingListingSlot = { shopId, groupKey: trimmed };
    }
    setMsg(msg, "Group renamed.", "ok");
    render();
    return;
  }

  if (act === "add-alt-want") {
    const row = btn.closest(".dash-listing-row");
    if (!row) return;
    const list = row.querySelector(".dash-alt-wants-list");
    if (!list) return;
    if (list.querySelectorAll(".dash-alt-want").length >= 2) return;
    list.insertAdjacentHTML("beforeend", dashAltWantRowHtml({ item: "", amount: 1, unit: "" }));
    const addBtn = row.querySelector('[data-act="add-alt-want"]');
    if (addBtn && list.querySelectorAll(".dash-alt-want").length >= 2) addBtn.hidden = true;
    markDashDirty();
    return;
  }
  if (act === "remove-alt-want") {
    const row = btn.closest(".dash-listing-row");
    const alt = btn.closest(".dash-alt-want");
    if (!row || !alt) return;
    alt.remove();
    const addBtn = row.querySelector('[data-act="add-alt-want"]');
    if (addBtn) addBtn.hidden = false;
    markDashDirty();
    const shopEl = row.closest("[data-shop]");
    const shop = shopEl && shopsData[shopEl.dataset.shop];
    if (shop) {
      const r = await commitListingRow(row, shop, shopEl.dataset.shop);
      if (r.ok && !r.skipped) setMsg(msg, "Alt price removed.", "ok");
    }
    return;
  }
  if (act === "dash-pick-alt-want") {
    const row = btn.closest(".dash-listing-row");
    const alt = btn.closest(".dash-alt-want");
    const shopEl = btn.closest("[data-shop]");
    if (!row || !alt || !shopEl) return;
    const shop = shopsData[shopEl.dataset.shop];
    openItemPicker(async name => {
      alt.dataset.wantItem = name;
      btn.innerHTML = itemIcon(name, false);
      const lab = alt.querySelector(".dash-item-label");
      if (lab) lab.textContent = formatItemName(name);
      const r = await commitListingRow(row, shop, shopEl.dataset.shop);
      if (r.ok && !r.skipped) setMsg(msg, "Listing updated.", "ok");
    });
    return;
  }

  if (act === "edit-bundle") {
    const shopEl = btn.closest("[data-shop]");
    const row = btn.closest(".dash-listing-row");
    if (!shopEl || !row) return;
    const shop = shopsData[shopEl.dataset.shop];
    let initial = null;
    try { initial = row.dataset.bundleContents ? JSON.parse(row.dataset.bundleContents) : null; }
    catch (e) { initial = null; }
    const next = await openBundleContentsEditor(initial);
    if (next === null) return;
    row.dataset.bundleContents = next ? JSON.stringify(next) : "";
    const r = await commitListingRow(row, shop, shopEl.dataset.shop);
    if (r.ok) {
      setMsg(msg, r.skipped ? "Bundle contents unchanged." : "Bundle contents saved.", "ok");
      if (!r.skipped) render();
    }
    return;
  }

  if (act === "dash-pick-item") {
    const shopEl = btn.closest("[data-shop]");
    const row = btn.closest(".dash-listing-row");
    if (!shopEl || !row) return;
    const shop = shopsData[shopEl.dataset.shop];
    const side = btn.dataset.side;
    openItemPicker(async name => {
      if (side === "want") row.dataset.wantItem = name;
      else row.dataset.sellItem = name;
      syncDashListingExtraVisibility(row);
      const sideEl = btn.closest(".dash-trade-side");
      if (sideEl) sideEl.querySelector(".dash-item-label").textContent = formatItemName(name);
      btn.innerHTML = itemIcon(name, false);
      const r = await commitListingRow(row, shop, shopEl.dataset.shop);
      if (r.ok && !r.skipped) {
        setMsg(msg, "Listing updated.", "ok");
        render();
      }
    });
    return;
  }

  const shopEl = btn.closest("[data-shop]");
  if (act === "pick-group-icon" && shopEl) {
    const shopId = shopEl.dataset.shop;
    const shop = shopsData[shopId];
    const gName = btn.dataset.group || "";
    openItemPicker(async name => {
      const icons = { ...normalizeGroupIcons(shop.group_icons) };
      icons[gName] = { icon_item: name, icon_path: null };
      const r = await sb.from("shops").update({ group_icons: icons }).eq("id", shopId);
      if (r.error) { setMsg(msg, r.error.message, "err"); return; }
      shop.group_icons = icons;
      setMsg(msg, "Group icon saved.", "ok");
      render();
    });
    return;
  }
  if (act === "clear-group-icon" && shopEl) {
    const shopId = shopEl.dataset.shop;
    const shop = shopsData[shopId];
    const gName = btn.dataset.group || "";
    const icons = { ...normalizeGroupIcons(shop.group_icons) };
    delete icons[gName];
    const group_order = pruneGroupOrder({ ...shop, group_icons: icons }, shop.listings);
    const patch = { group_icons: icons };
    if (JSON.stringify(group_order) !== JSON.stringify(normalizeGroupOrder(shop.group_order))) {
      patch.group_order = group_order;
    }
    const r = await sb.from("shops").update(patch).eq("id", shopId);
    if (r.error) { setMsg(msg, r.error.message, "err"); return; }
    shop.group_icons = icons;
    if (patch.group_order) shop.group_order = group_order;
    setMsg(msg, "Group icon cleared.", "ok");
    render();
    return;
  }

  if (!shopEl) return;
  const shopId = shopEl.dataset.shop;
  const shop = shopsData[shopId];
  const panel = shopEl.querySelector("[data-panel]");
  const lEl = btn.closest("[data-listing]");
  const lid = lEl ? Number(lEl.dataset.listing) : null;
  let res;

  // ---- shop details panel
  if (act === "toggle-panel") { panel.hidden = !panel.hidden; return; }
  if (act === "close-panel") { panel.hidden = true; return; }
  if (act === "toggle-sale") {
    const id = String(shopId);
    if (openSaleForms.has(id)) openSaleForms.delete(id);
    else openSaleForms.add(id);
    render();
    return;
  }
  if (act === "mark-all-in" || act === "mark-all-out") {
    const ids = (shop.listings || []).map(l => l.id);
    if (!ids.length) { setMsg(msg, "No listings.", "err"); return; }
    stockUndo[shopId] = (shop.listings || []).map(l => ({
      id: l.id, stock: l.stock, in_stock: l.in_stock, group_name: l.group_name || null
    }));
    const stock = act === "mark-all-out" ? 0 : null;
    const now = new Date().toISOString();
    for (const id of ids) {
      const r = await sb.from("listings").update({
        stock, in_stock: inStockFromStock(stock), updated_at: now
      }).eq("id", id);
      if (r.error) { setMsg(msg, r.error.message, "err"); return; }
    }
    setMsg(msg, act === "mark-all-out" ? "All listings marked out of stock." : "All listings marked in stock.", "ok");
    render();
    return;
  }
  if (act === "undo-stock") {
    const snap = stockUndo[shopId];
    if (!snap || !snap.length) { setMsg(msg, "Nothing to undo.", "err"); return; }
    const now = new Date().toISOString();
    for (const row of snap) {
      const r = await sb.from("listings").update({
        stock: row.stock,
        in_stock: inStockFromStock(row.stock),
        group_name: row.group_name,
        updated_at: now
      }).eq("id", row.id);
      if (r.error) { setMsg(msg, r.error.message, "err"); return; }
    }
    delete stockUndo[shopId];
    setMsg(msg, "Restored previous stock.", "ok");
    render();
    return;
  }
  if (act === "pick-icon") {
    openItemPicker(name => {
      panel.dataset.iconItem = name;
      panel.querySelector(".p-iconprev").innerHTML = shopIcon({ icon_item: name, icon_path: panel.dataset.removePic ? null : shop.icon_path }, "card");
    });
    return;
  }
  if (act === "remove-pic") {
    panel.dataset.removePic = "1";
    panel.querySelector(".p-iconprev").innerHTML = shopIcon({ icon_item: panel.dataset.iconItem, icon_path: null }, "card");
    btn.remove();
    return;
  }
  if (act === "bulk-toggle") {
    const bulk = shopEl.querySelector("[data-bulk]");
    bulk.hidden = !bulk.hidden;
    return;
  }
  if (act === "bulk-out") {
    shopEl.querySelectorAll(".b-stock").forEach(inp => { inp.value = "0"; });
    return;
  }
  if (act === "bulk-stock") {
    const n = await promptModal({
      title: "Set stock for all",
      body: "Applies to every row in bulk edit. Leave blank for unlimited.",
      label: "Stock left",
      defaultValue: "10",
      placeholder: "blank = unlimited",
      confirmLabel: "Apply"
    });
    if (n === null) return;
    const v = n.trim() === "" ? "" : String(Math.max(0, parseInt(n, 10) || 0));
    shopEl.querySelectorAll(".b-stock").forEach(inp => { inp.value = v; });
    return;
  }
  if (act === "bulk-save") {
    btn.disabled = true;
    stockUndo[shopId] = (shop.listings || []).map(l => ({
      id: l.id, stock: l.stock, in_stock: l.in_stock, group_name: l.group_name || null
    }));
    const now = new Date().toISOString();
    for (const tr of shopEl.querySelectorAll("[data-bulk-id]")) {
      const stock = parseStockInput(tr.querySelector(".b-stock").value);
      const group_name = (tr.querySelector(".b-group").value || "").trim() || null;
      const r = await sb.from("listings").update({
        stock, in_stock: inStockFromStock(stock), group_name, updated_at: now
      }).eq("id", tr.dataset.bulkId);
      if (r.error) { setMsg(msg, r.error.message, "err"); btn.disabled = false; return; }
    }
    btn.disabled = false;
    setMsg(msg, "Stock / groups updated for all listings.", "ok");
    render();
    return;
  }
  if (act === "save-shop") {
    const name = panel.querySelector(".p-name").value.trim();
    if (!name) { setMsg(msg, "The shop needs a plain name.", "err"); return; }
    const x = panel.querySelector(".p-x").value, z = panel.querySelector(".p-z").value;
    const shopX = x === "" ? null : parseInt(x, 10);
    const shopZ = z === "" ? null : parseInt(z, 10);
    let auto_stock_enabled = !!shop.auto_stock_enabled;
    if (autoStockUi()) {
      const autoEl = panel.querySelector(".p-auto-stock");
      auto_stock_enabled = !!(autoEl && autoEl.checked);
      if (auto_stock_enabled && (shopX == null || shopZ == null || Number.isNaN(shopX) || Number.isNaN(shopZ))) {
        setMsg(msg, "Auto stock needs shop X/Z.", "err");
        return;
      }
    }
    let icon_path = panel.dataset.removePic ? null : shop.icon_path;
    const file = panel.querySelector(".p-file").files[0];
    btn.disabled = true;
    if (file) {
      setMsg(msg, "Uploading picture...");
      const up = await uploadImage(file, "shops", me.session.user.id);
      if (!up.ok) { setMsg(msg, up.message, "err"); btn.disabled = false; return; }
      icon_path = up.path;
    }
    const shopPatch = {
      name,
      city: panel.querySelector(".p-city").value.trim() || null,
      nation: panel.querySelector(".p-nation").value.trim() || null,
      x: shopX, z: shopZ,
      styled_name: panel.querySelector(".p-styled").value.trim() || null,
      description: panel.querySelector(".p-desc").value.trim() || null,
      find_note: panel.querySelector(".p-find").value.trim() || null,
      icon_item: panel.dataset.iconItem || null, icon_path
    };
    if (autoStockUi()) {
      shopPatch.auto_stock_enabled = auto_stock_enabled;
    }
    const r = await sb.from("shops").update(shopPatch).eq("id", shopId);
    btn.disabled = false;
    if (r.error) { setMsg(msg, r.error.message, "err"); return; }
    if (shop.icon_path && shop.icon_path !== icon_path) sb.storage.from("uploads").remove([shop.icon_path]);
    setMsg(msg, "Shop details saved.", "ok");
    render();
    return;
  }

  // ---- open / close / sales
  if (act === "close-shop") {
    if (!await confirmModal({ title: "Close shop", body: "Your shop will disappear from Find, favourites, and the market until you open it again. You can still preview and edit it here.", confirmLabel: "Close shop" })) return;
    res = await sb.from("shops").update({ is_open: false }).eq("id", shopId);
    if (res.error) { setMsg(msg, res.error.message, "err"); return; }
    setMsg(msg, "Shop closed.", "ok");
    render();
    return;
  } else if (act === "open-shop") {
    res = await sb.from("shops").update({ is_open: true }).eq("id", shopId);
    if (res.error) { setMsg(msg, res.error.message, "err"); return; }
    setMsg(msg, "Shop is open again.", "ok");
    render();
    return;
  } else if (act === "start-sale") {
    const form = shopEl.querySelector("[data-sale-form]");
    const name = form.querySelector(".sale-name").value.trim();
    const pctRaw = form.querySelector(".sale-pct").value.trim();
    const endRaw = form.querySelector(".sale-end").value;
    const r = await startShopSale(shopId, {
      name,
      percent: pctRaw === "" ? null : pctRaw,
      ends_at: endRaw ? new Date(endRaw).toISOString() : null
    });
    if (r.error) { setMsg(msg, r.error, "err"); return; }
    openSaleForms.delete(String(shopId));
    setMsg(msg, "Sale started.", "ok");
    render();
    return;
  } else if (act === "end-sale") {
    if (!await confirmModal({ title: "End sale", body: "End this sale and restore original diamond prices?", confirmLabel: "End sale" })) return;
    const r = await endShopSale(shopId);
    if (r.error) { setMsg(msg, r.error, "err"); return; }
    openSaleForms.delete(String(shopId));
    setMsg(msg, "Sale ended. Prices restored.", "ok");
    render();
    return;
  }

  // ---- shop + listing buttons
  if (act === "del-shop") {
    if (!await confirmModal({ title: "Delete shop", body: "Delete this shop and all its listings? This can't be undone.", confirmLabel: "Delete shop", danger: true })) return;
    res = await sb.from("shops").delete().eq("id", shopId);
    if (!res.error && shop.icon_path) sb.storage.from("uploads").remove([shop.icon_path]);
  } else if (act === "del-listing") {
    if (!await confirmModal({ title: "Remove listing", body: "Remove this listing?", confirmLabel: "Remove", danger: true })) return;
    res = await sb.from("listings").delete().eq("id", lid);
  } else if (act === "refresh") {
    res = await sb.from("listings").update({ updated_at: new Date().toISOString() }).eq("id", lid);
  } else if (act === "duplicate") {
    const src = shop.listings.find(l => l.id === lid);
    if (!src) return;
    const sort_order = nextListingSortOrder(shop.listings);
    res = await sb.from("listings").insert({
      shop_id: shopId,
      sell_item: src.sell_item, sell_amount: src.sell_amount, sell_unit: src.sell_unit || "",
      want_item: src.want_item, want_amount: src.want_amount, want_unit: src.want_unit || "",
      stock: src.stock, in_stock: inStockFromStock(src.stock),
      group_name: src.group_name || null, sort_order,
      enchants: (isEnchantableItem(src.sell_item) || isEnchantableItem(src.want_item))
        ? normalizeListingEnchants(src.enchants) : null,
      notes: normalizeListingNotes(src.notes),
      bundle_contents: (isBundleItem(src.sell_item) || isBundleItem(src.want_item))
        ? normalizeBundleContents(src.bundle_contents) : null,
      alt_wants: normalizeAltWants(src.alt_wants)
    });
    if (!res.error) setMsg(msg, "Listing duplicated.", "ok");
  } else if (act === "toggle-stock") {
    const l = shop.listings.find(x => x.id === lid);
    if (!l) return;
    const out = dashListingOut(l);
    const now = new Date().toISOString();
    if (out) {
      res = await sb.from("listings").update({
        in_stock: true,
        stock: l.stock === 0 ? null : l.stock,
        updated_at: now
      }).eq("id", lid);
    } else {
      res = await sb.from("listings").update({ in_stock: false, stock: 0, updated_at: now }).eq("id", lid);
    }
    if (!res.error) setMsg(msg, out ? "Marked in stock." : "Marked out of stock.", "ok");
  } else if (act === "add-listing") {
    const panel = shopEl.querySelector(".dash-add-listing-panel");
    const add = panel && panel.querySelector(".addform");
    if (!add) { setMsg(msg, "Open + on a group to add a listing.", "err"); return; }
    const stock = parseStockInput(add.querySelector(".l-stock").value);
    const group_name = normalizeListingGroup(panel.dataset.group || "");
    const f = {
      sa: parseInt(add.querySelector(".l-sa").value), wa: parseInt(add.querySelector(".l-wa").value),
      si: add.querySelector('[data-pick="sell"]').dataset.value || "", wi: add.querySelector('[data-pick="want"]').dataset.value || "",
      su: add.querySelector(".l-su").value, wu: add.querySelector(".l-wu").value
    };
    if (!f.si || !f.wi || !(f.sa > 0) || !(f.wa > 0)) { setMsg(msg, "Pick both items and fill in both amounts.", "err"); return; }
    if (!await dupOk(shop, f, null, "Add")) return;
    if (!await marketPriceWarnOk(f)) return;
    res = await sb.from("listings").insert({
      shop_id: shopId, sell_item: f.si, sell_amount: f.sa, sell_unit: f.su, want_item: f.wi, want_amount: f.wa, want_unit: f.wu,
      stock, in_stock: inStockFromStock(stock), group_name,
      sort_order: nextListingSortOrder(shop.listings)
    });
    if (!res.error) {
      addingListingSlot = { shopId, groupKey: String(group_name || "") };
    }
  }

  if (res && res.error) { setMsg(msg, res.error.message, "err"); return; }
  if (act === "duplicate") setMsg(msg, "Listing duplicated.", "ok");
  if (act === "add-listing") setMsg(msg, "Listing added.", "ok");
  render(act === "add-listing" ? shopId : null);
});

document.getElementById("shops").addEventListener("input", e => {
  if (e.target.matches("input, textarea, select")) markDashDirty();
});
document.getElementById("newshop").addEventListener("input", e => {
  if (e.target.matches("input, textarea, select")) markDashDirty();
});

document.getElementById("shops").addEventListener("change", async e => {
  const t = e.target;
  if (t.matches("input, textarea, select")) markDashDirty();
  if (!t.matches(".dash-wu, .dash-su, .dash-alt-wu")) return;
  const row = t.closest(".dash-listing-row");
  const shopEl = t.closest("[data-shop]");
  if (!row || !shopEl) return;
  const shop = shopsData[shopEl.dataset.shop];
  const r = await commitListingRow(row, shop, shopEl.dataset.shop);
  if (r.ok && !r.skipped) {
    setMsg(msg, "Listing updated.", "ok");
    if (!t.matches(".dash-alt-wu")) render();
  }
});

document.getElementById("shops").addEventListener("focusout", async e => {
  const t = e.target;
  if (!t.matches(".dash-wa, .dash-sa, .dash-stock-amt, .dash-enchants, .dash-notes, .dash-alt-wa")) return;
  const row = t.closest(".dash-listing-row");
  const shopEl = t.closest("[data-shop]");
  if (!row || !shopEl) return;
  const shopId = shopEl.dataset.shop;
  const shop = shopsData[shopId];
  requestAnimationFrame(async () => {
    if (row.contains(document.activeElement)) return;
    const r = await commitListingRow(row, shop, shopId);
    if (r.ok && !r.skipped) {
      setMsg(msg, "Listing updated.", "ok");
      // Don't full-render on notes/enchants ΓÇö keeps caret; only refresh for trade/stock
      if (t.matches(".dash-wa, .dash-sa, .dash-stock-amt")) render();
      else clearDashDirty();
    }
  });
});

load();
</script>
</body>
</html>
