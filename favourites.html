<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favourites - CivMC Shops</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body class="fav-page">
<nav id="nav"></nav>
<main>
  <header class="page-hero">
    <span class="page-eyebrow">Collection</span>
    <h1>Favourites</h1>
    <p class="sub">Shops you've starred. Private to you.</p>
  </header>
  <div class="msg" id="msg"></div>
  <div id="list" class="shop-grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="mock.js"></script>
<script src="app.js?v=7"></script>
<script>
const msg = document.getElementById("msg");
let me = null;

async function load() {
  const ctx = await requireLogin();
  if (!ctx) return;
  me = ctx.session.user.id;
  const { data, error } = await sb.from("favorites")
    .select("id, shop_id, created_at, shops(id, owner_id, name, styled_name, icon_item, icon_path, city, nation, hours, find_note, transit_note, x, z, timed_out, archived, is_open, sale_name, sale_percent, sale_label, sale_starts_at, sale_ends_at, sale_active, profiles(username, mc_username, discord_username, avatar_path, timed_out), listings(id, updated_at, stock, in_stock, timed_out), reviews(rating, traded, timed_out))")
    .eq("user_id", me).order("created_at", { ascending: false });
  if (error) { setMsg(msg, error.message, "err"); return; }
  const rows = (data || []).filter(f => f.shops && shopListedPublicly(f.shops, f.shops.profiles));
  const box = document.getElementById("list");
  if (!rows.length) {
    box.className = "";
    box.innerHTML = emptyState("No favourites yet. Star a shop to save it here.", "index.html", "Browse shops");
    return;
  }
  box.className = "shop-grid";
  box.innerHTML = rows.map(f => {
    const s = f.shops;
    const ls = s.listings || [];
    return shopCardHtml({
      ...s,
      listings: [{ count: ls.length }]
    }, {
      listingCount: ls.length,
      actions: iconBtn("starFill", { on: true, title: "Remove from favourites", attrs: `data-unfav="${s.id}"` })
    });
  }).join("");
}

document.getElementById("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-unfav]");
  if (!b) return;
  const { error } = await sb.from("favorites").delete().eq("user_id", me).eq("shop_id", b.dataset.unfav);
  if (error) { setMsg(msg, error.message, "err"); return; }
  load();
});

load();
</script>
</body>
</html>
